id: lidarModule_OFDM_Detector
label: OFDM_Detector
category: '[lidarModule]'

templates:
  imports: from gnuradio import lidarModule
  make: lidarModule.OFDM_Detector(${frame_len}, ${N}, ${cplen}, ${samp_rate}, ${thresh}, ${min_r}, ${min_p})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: frame_len
  label: Frame Length
  dtype: int
  default: 7488
- id: N
  label: FFT Length
  dtype: int
  default: 512
- id: cplen
  label: CP Length
  dtype: int
  default: 64
- id: samp_rate
  label: Sampling Rate
  dtype: float
  default: 20e6
- id: thresh
  label: Threshold
  dtype: float
  default: 0.7
- id: min_r
  label: Min Power
  dtype: float
  default: 1e-6
- id: min_p
  label: Min P (auto-corr metrix)
  dtype: float
  default: 1e-6
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
- label: in
  domain: stream
  dtype: complex

outputs:
- label: Ms
  domain: stream
  dtype: float
- label: M
  domain: stream
  dtype: float
- label: IQ
  domain: stream
  dtype: complex
- label: IQ_cfo
  domain: stream
  dtype: complex

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
